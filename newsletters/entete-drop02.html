<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>En-tête newsletter Drop 02</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cormorant:ital,wght@0,400;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
  /* Rendu à 600 × 675 px, capturé en ×2 → /email/drop02-entete.jpg */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 675px; overflow: hidden; background: #0A1F3D; }
  body { position: relative; color: #F4F1EC; font-family: 'EB Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; }
  .eau { position: absolute; inset: 0; background: url(eau.jpg) 50% 50% / cover; }
  .veil { position: absolute; inset: 0; background: rgba(15, 40, 101, 0.44); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 75% at 50% 45%, transparent 30%, rgba(10, 31, 61, 0.72) 100%); }
  .grain { position: absolute; inset: 0; opacity: 0.1; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .frame { position: absolute; inset: 18px; border: 1px solid rgba(244, 241, 236, 0.22); }
  .corner { position: absolute; font-family: 'American Typewriter', 'Special Elite', monospace; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; opacity: 0.9; }
  .tl { top: 34px; left: 36px; } .tr { top: 34px; right: 36px; }
  .bl { bottom: 34px; left: 36px; }
  .br { bottom: 31px; right: 36px; font-family: 'Cormorant', serif; font-style: italic; font-size: 16px; letter-spacing: 0.04em; text-transform: none; }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #E39A7C; margin-right: 9px; vertical-align: 1px; }
  main { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 6px; }
  .logo { font-family: 'Special Elite', monospace; font-weight: 400; font-size: 118px; line-height: 0.9; letter-spacing: 0.02em; text-shadow: 0 2px 24px rgba(10,31,61,0.4); }
  .wave { width: 150px; aspect-ratio: 744 / 113; margin-top: 16px; background: #F4F1EC;
    -webkit-mask: url(../photos/wave_divider.png) center / contain no-repeat; mask: url(../photos/wave_divider.png) center / contain no-repeat; }
  .lede { font-family: 'Cormorant', serif; font-style: italic; font-size: 34px; margin-top: 30px; text-shadow: 0 1px 14px rgba(10,31,61,0.8); }
  .sub { font-size: 20px; margin-top: 10px; color: rgba(244,241,236,0.88); text-shadow: 0 1px 14px rgba(10,31,61,0.8); }
</style>
</head>
<body>
  <div class="eau"></div><div class="veil"></div><div class="vignette"></div><div class="grain"></div>
  <div class="frame"></div>
  <p class="corner tl"><span class="dot"></span>Drop 02 — en préparation</p>
  <p class="corner tr">@typique.fr</p>
  <p class="corner bl">Mer Méditerranée &amp; Océan Atlantique</p>
  <p class="corner br">entre sel et soleil</p>
  <main>
    <h1 class="logo">typique</h1>
    <div class="wave"></div>
    <p class="lede">Le prochain drop arrive très bientôt.</p>
    <p class="sub">Avec des pièces encore plus typiques.</p>
  </main>
</body>
</html>
