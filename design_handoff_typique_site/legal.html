<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typique — Mentions légales & confidentialité</title>
<link rel="icon" type="image/svg+xml" href="{{asset:favicon.svg}}">
<link rel="apple-touch-icon" href="{{asset:apple-touch-icon.png}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fonts_attente}}">
<style>
  :root { --navy: #0F2865; --cream: #F4F1EC; --terra-deep: #C77D60; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--cream); color: var(--navy); font-family: 'EB Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 72px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .logo { font-family: 'Special Elite', monospace; font-size: 28px; color: var(--navy); text-decoration: none; }
  .back { font-family: 'American Typewriter', 'Special Elite', monospace; font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--navy); text-underline-offset: 4px; }
  .rule { height: 5px; border-top: 1px solid var(--navy); border-bottom: 1px solid var(--navy); opacity: .5; margin: 14px 0 22px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: 'Cormorant', serif; font-style: italic; font-size: 18px; }
  nav a { color: var(--terra-deep); }
  section { padding-top: 44px; }
  h2 { font-family: 'Special Elite', monospace; font-weight: 400; font-size: 26px; margin-bottom: 18px; }
  h3 { font-family: 'American Typewriter', 'Special Elite', monospace; font-weight: 400; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; margin: 22px 0 6px; opacity: .75; }
  p { font-size: 17px; line-height: 1.65; white-space: pre-line; }
</style>
</head>
<body>
  <div class="wrap">
    <header><a class="logo" href="/">typique</a><a class="back" href="/">← Retour</a></header>
    <div class="rule"></div>
    <nav>
      <a href="#mentions">Mentions légales</a>
      <a href="#confidentialite">Politique de confidentialité</a>
      <a href="#cgv">Conditions générales de vente</a>
    </nav>
<!--__LEGAL__-->
  </div>
</body>
</html>
