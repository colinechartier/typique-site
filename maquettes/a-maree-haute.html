<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typique — Maquette A · Marée haute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
  :root {
    --navy: #0F2865; --navy-deep: #0A1F3D; --cream: #F4F1EC; --sand: #D7CFC2;
    --terra: #E39A7C; --gutter: clamp(16px, 3vw, 36px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--navy-deep); color: var(--cream);
    font-family: 'EB Garamond', Georgia, serif; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .tw { font-family: 'American Typewriter', 'Special Elite', monospace; }

  /* ---------- Fond : vidéo + voile + vignette + grain ---------- */
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .veil { position: absolute; inset: 0; background: rgba(15, 40, 101, 0.42); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 30%, rgba(10, 31, 61, 0.7) 100%); }
  .grain { position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* ---------- Cadre « viseur » ---------- */
  .frame { position: fixed; inset: var(--gutter); border: 1px solid rgba(244, 241, 236, 0.2); pointer-events: none; z-index: 2; }
  .corner { position: fixed; z-index: 3; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--cream); opacity: 0; animation: fade 1.2s ease 2.6s forwards; }
  .corner a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(244, 241, 236, 0.35); padding-bottom: 2px; }
  .tl { top: calc(var(--gutter) + 18px); left: calc(var(--gutter) + 20px); }
  .tr { top: calc(var(--gutter) + 18px); right: calc(var(--gutter) + 20px); }
  .bl { bottom: calc(var(--gutter) + 18px); left: calc(var(--gutter) + 20px); }
  .br { bottom: calc(var(--gutter) + 18px); right: calc(var(--gutter) + 20px); font-family: 'Cormorant', serif; font-style: italic; font-size: 15px; letter-spacing: 0.04em; text-transform: none; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--terra); margin-right: 10px; vertical-align: 1px; animation: pulse 2.4s ease-in-out infinite; }

  /* ---------- Contenu central ---------- */
  main { position: relative; z-index: 4; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 calc(var(--gutter) + 24px); }
  .logo { font-family: 'Special Elite', monospace; font-weight: 400; font-size: clamp(64px, 15vw, 210px); line-height: 0.9; letter-spacing: 0.4em; margin-right: -0.4em; opacity: 0;
    animation: tighten 2.2s cubic-bezier(.2,.7,.2,1) 0.3s forwards; text-shadow: 0 2px 30px rgba(10,31,61,0.35); }
  .wave { width: clamp(150px, 18vw, 240px); aspect-ratio: 744 / 113; background: var(--cream); margin: clamp(14px, 2vw, 22px) auto 0;
    -webkit-mask: url(/photos/wave_divider.png) center / contain no-repeat; mask: url(/photos/wave_divider.png) center / contain no-repeat;
    clip-path: inset(0 100% 0 0); animation: draw 1.4s ease 1.6s forwards; }
  .lede { font-family: 'Cormorant', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 3.2vw, 40px); margin-top: clamp(26px, 4vh, 44px); min-height: 1.3em; }
  .cursor { display: inline-block; width: 1px; height: 0.9em; background: var(--cream); margin-left: 3px; vertical-align: -0.1em; animation: blink 1s steps(1) infinite; }
  .lede, .sub { text-shadow: 0 1px 14px rgba(10, 31, 61, 0.75); }
  .sub { max-width: 30em; font-size: clamp(15px, 1.25vw, 18px); line-height: 1.6; opacity: 0; margin-top: 14px; color: rgba(244,241,236,0.82); }
  .sub.on { animation: rise 1s ease forwards; }

  form { margin-top: clamp(24px, 4vh, 40px); display: flex; align-items: flex-end; gap: 18px; width: min(460px, 100%); opacity: 0; }
  form.on { animation: rise 1s ease 0.25s forwards; }
  input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid rgba(244,241,236,0.55); color: var(--cream); font: inherit; font-size: 17px; padding: 8px 2px; outline: none; transition: border-color .3s; }
  input::placeholder { color: rgba(244,241,236,0.45); font-style: italic; }
  input:focus { border-color: var(--terra); }
  button { background: none; border: 0; cursor: pointer; color: var(--terra); font-family: 'American Typewriter', 'Special Elite', monospace; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; padding: 10px 0; white-space: nowrap; }
  button:hover { color: var(--cream); }
  .merci { margin-top: clamp(24px, 4vh, 40px); font-family: 'Cormorant', serif; font-style: italic; font-size: 20px; color: var(--terra); display: none; }

  /* ---------- Lexique défilant ---------- */
  .lexique { position: fixed; left: 0; right: 0; bottom: calc(var(--gutter) + 56px); z-index: 3; overflow: hidden; opacity: 0; animation: fade 1.5s ease 3s forwards;
    -webkit-mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
  .lexique div { display: flex; gap: 3.2em; width: max-content; animation: marquee 70s linear infinite; font-family: 'Cormorant', serif; font-style: italic; font-size: 17px; color: rgba(244,241,236,0.38); white-space: nowrap; }
  .lexique span:nth-child(4n+3) { color: rgba(227,154,124,0.6); }

  @keyframes tighten { from { opacity: 0; letter-spacing: 0.4em; margin-right: -0.4em; filter: blur(6px); } to { opacity: 1; letter-spacing: 0.02em; margin-right: -0.02em; filter: blur(0); } }
  @keyframes draw { to { clip-path: inset(0 0 0 0); } }
  @keyframes fade { to { opacity: 0.85; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }
  @keyframes marquee { to { transform: translateX(-50%); } }

  @media (max-width: 640px) {
    .tr { display: none; }
    .bl { display: none; }
    .br { left: 0; right: 0; text-align: center; }
    .lexique { bottom: calc(var(--gutter) + 52px); }
    form { flex-direction: column; align-items: stretch; gap: 6px; }
    button { text-align: center; padding: 14px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="v" autoplay muted loop playsinline preload="auto" poster="/media/hero-poster.webp"></video>
    <div class="veil"></div><div class="vignette"></div><div class="grain"></div>
  </div>
  <div class="frame"></div>

  <p class="corner tl tw"><span class="dot"></span>Drop 03 — en préparation</p>
  <p class="corner tr tw"><a href="https://instagram.com/typique.fr">@typique.fr</a></p>
  <p class="corner bl tw">Calanques · Cap Ferret</p>
  <p class="corner br">entre sel et soleil</p>

  <main>
    <h1 class="logo">typique</h1>
    <div class="wave" aria-hidden="true"></div>
    <p class="lede"><span id="lede"></span><span class="cursor" id="cursor"></span></p>
    <p class="sub" id="sub">Pas encore de date : c'est la marée qui décide.<br>Laisse ton adresse, on t'écrit avant tout le monde.</p>
    <form id="f">
      <input type="email" required placeholder="ton@email.fr" aria-label="Ton adresse email">
      <button type="submit">Me prévenir →</button>
    </form>
    <p class="merci" id="merci">C'est noté. On t'écrit dès que ça ouvre.</p>
  </main>

  <div class="lexique" aria-hidden="true"><div id="lex"></div></div>

<script>
  // Vidéo : 540p sur mobile, 720p sinon
  document.getElementById('v').src = matchMedia('(max-width: 767px)').matches ? '/media/hero-540.mp4' : '/media/hero-720.mp4';

  // Lexique (doublé pour une boucle sans couture)
  const mots = ['garrigue', 'baïne', 'mistral', 'tchanquée', 'restanque', 'cachotte', 'farigoule', 'la leyre'];
  document.getElementById('lex').innerHTML = [...mots, ...mots, ...mots, ...mots].map(m => `<span>${m} ·</span>`).join('');

  // Machine à écrire
  const texte = 'Le prochain drop se prépare.';
  const el = document.getElementById('lede');
  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const suite = () => { document.getElementById('sub').classList.add('on'); document.getElementById('f').classList.add('on'); };
  if (reduit) { el.textContent = texte; suite(); }
  else {
    let i = 0;
    setTimeout(function taper() {
      el.textContent = texte.slice(0, ++i);
      if (i < texte.length) setTimeout(taper, 55 + Math.random() * 70);
      else setTimeout(() => { document.getElementById('cursor').style.display = 'none'; suite(); }, 900);
    }, 2300);
  }

  // Maquette : pas d'envoi réel
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    e.target.style.display = 'none';
    document.getElementById('merci').style.display = 'block';
  });
</script>
</body>
</html>
