# ==========================================================================
#  RÉGLAGE DU DROP
#  Le seul fichier à ouvrir pour changer les dates ou les pièces en vente.
# ==========================================================================
#
#  Comment s'en servir
#   1. Change ce que tu veux plus bas, ou demande à Claude de le faire.
#   2. Reconstruis le site avec : python3 tools/build.py   (Claude s'en charge).
#   3. Si quelque chose est mal écrit, la construction s'arrête et dit quoi
#      corriger. Le site n'est alors pas modifié.
#
#  Les lignes qui commencent par # sont des commentaires : le site les ignore.
#  Les lignes entre crochets, comme [drop], sont des titres de partie : ne les change pas.


[drop]
# Nom du drop, affiché sur le site.
nom = Drop 02

# Ouverture : à cette heure précise, les boutons « + Panier » s'activent.
# Les heures sont des heures de Paris, écrites année-mois-jour heure:minute.
# Exemple : 2026-11-06 12:00 veut dire vendredi 6 novembre 2026 à 12 h.
ouverture = 2026-11-06 12:00

# Fermeture : à cette heure précise, la vente s'arrête.
# 00:00 veut dire minuit juste : 2026-11-27 00:00 tombe dans la nuit du jeudi 26 au vendredi 27 novembre.
fermeture = 2026-11-27 00:00


[nouvelle-collection]
# Les pièces du Drop 02 : elles s'affichent dans l'onglet « Nouvelle collection ».
# Une ligne par pièce :  Nom de la pièce = identifiant Shopify
# Le nom est celui du site (les accents et les majuscules ne comptent pas).
# L'identifiant Shopify est le long numéro à la fin de l'adresse de la fiche produit
# dans Shopify (exemple : .../products/15770490175872).
# Tant que l'identifiant est vide, la pièce reste visible avec « Bientôt disponible »,
# sans bouton d'achat. Rempli au bloc 10, avec les produits créés dans Shopify (étiquette « Drop 02 »).
# Pour retirer une pièce de la boutique : efface sa ligne (ou mets un # devant).
# L'ordre des lignes n'a pas d'importance : la boutique garde son propre ordre.
L'Estaque = 16041054962048
La Pinède = 16041054994816
Soleil couchant = 16041055027584
Petit matin = 16041055060352
Plein cagnard = 16041055125888
Le Minot du Sud = 16041055191424
Corps Salé Coeur Solaire = 16041055256960


[anciennes-pieces]
# Les pièces du Drop 01 encore en vente : elles s'affichent dans leur catégorie
# (T-shirts, Hoodies, Accessoires). Même écriture que ci-dessus.
Le Ferret = 15770490175872
L'Entre Deux = 15770490962304
Sable chaud = 15770491683200
Le Mistral = 15770492764544
