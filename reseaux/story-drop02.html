<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Story Drop 02 — 1080 × 1920</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cormorant:ital,wght@1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
  /* Story Instagram 1080 × 1920. L'animation est pilotée par window.__rendu(t) (une image = un instant t),
     pour que tools/render_story.py puisse capturer chaque image de façon exacte.
     Zone utile : entre y = 250 et y = 1580 (le haut et le bas sont couverts par l'interface Instagram). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A1F3D; }
  body { position: relative; color: #F4F1EC; font-family: 'EB Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; }
  #eau { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .veil { position: absolute; inset: 0; background: rgba(15, 40, 101, 0.48); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 95% 70% at 50% 45%, transparent 30%, rgba(10, 31, 61, 0.72) 100%); }
  .grain { position: absolute; inset: -200px; opacity: 0.1; mix-blend-mode: overlay; background-size: 320px 320px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .frame { position: absolute; inset: 44px; border: 1.5px solid rgba(244, 241, 236, 0.22); }

  .tw { font-family: 'American Typewriter', 'Special Elite', monospace; text-transform: uppercase; }
  .top { position: absolute; top: 292px; left: 0; right: 0; text-align: center; font-size: 25px; letter-spacing: 0.3em; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #E39A7C; margin-right: 22px; vertical-align: 3px; }

  main { position: absolute; top: 560px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo { font-family: 'Special Elite', monospace; font-weight: 400; font-size: 215px; line-height: 0.9; white-space: nowrap; text-shadow: 0 4px 50px rgba(10, 31, 61, 0.4); }
  .wave { width: 380px; aspect-ratio: 744 / 113; margin-top: 40px; background: #F4F1EC;
    -webkit-mask: url(../photos/wave_divider.png) center / contain no-repeat; mask: url(../photos/wave_divider.png) center / contain no-repeat; }
  .lede { font-family: 'Cormorant', serif; font-style: italic; font-size: 76px; line-height: 1.15; margin-top: 80px; height: 2.3em; white-space: pre-line; text-shadow: 0 2px 28px rgba(10, 31, 61, 0.8); }
  .cursor { display: inline-block; width: 3px; height: 0.82em; background: #F4F1EC; margin-left: 6px; vertical-align: -0.06em; }
  .sub { font-size: 42px; margin-top: 30px; color: rgba(244, 241, 236, 0.9); text-shadow: 0 2px 28px rgba(10, 31, 61, 0.8); }

  .url { position: absolute; top: 1322px; left: 0; right: 0; text-align: center; font-size: 28px; letter-spacing: 0.3em; }
  .url span { display: inline-block; padding: 0 0 10px 0.3em; border-bottom: 2px solid #E39A7C; text-shadow: 0 2px 22px rgba(10, 31, 61, 0.9); }
  .seas { position: absolute; top: 1462px; left: 0; right: 0; text-align: center; font-size: 21px; letter-spacing: 0.28em; }
  .tag { position: absolute; top: 1504px; left: 0; right: 0; text-align: center; font-family: 'Cormorant', serif; font-style: italic; font-size: 38px; }
</style>
</head>
<body>
  <!-- Images de l'eau pré-extraites (30 i/s, déjà au format 1080 × 1920) :
       swift tools/extract_frames.swift sources/hero-video.mp4 .cache/story-eau 30 15 1080 1920 -->
  <img id="eau" alt="" src="../.cache/story-eau/00000.jpg">
  <div class="veil"></div><div class="vignette"></div><div class="grain" id="grain"></div>
  <div class="frame"></div>

  <p class="top tw" id="top"><span class="dot" id="dot"></span>Drop 02 — en préparation</p>
  <main>
    <h1 class="logo" id="logo">typique</h1>
    <div class="wave" id="wave"></div>
    <p class="lede"><span id="lede"></span><span class="cursor" id="cursor"></span></p>
    <p class="sub" id="sub">Avec des pièces encore plus typiques.</p>
  </main>
  <p class="url tw" id="url"><span>boutiquetypique.fr</span></p>
  <p class="seas tw" id="seas">Mer Méditerranée &amp; Océan Atlantique</p>
  <p class="tag" id="tag">entre sel et soleil</p>

<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const easeOut = (p) => 1 - Math.pow(1 - p, 4);
  const easeInOut = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const lerp = (a, b, p) => a + (b - a) * p;

  // Frappe à la machine : instants de chaque lettre (aléa fixe, pour un rendu identique à chaque export)
  const TEXTE = 'Le prochain drop arrive\ntrès bientôt.';
  let graine = 7;
  const alea = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
  const instants = [];
  let t0 = 3.0;
  for (const c of TEXTE) { t0 += c === '\n' ? 0.3 : 0.055 + alea() * 0.07; instants.push(t0); }
  const FIN_FRAPPE = t0;
  const DEBUT_SUB = FIN_FRAPPE + 0.7;
  const DEBUT_URL = FIN_FRAPPE + 2.1;

  window.__rendu = (t) => {
    // « typique » qui se resserre
    const pl = easeOut(clamp((t - 0.3) / 2.2));
    const ls = lerp(0.4, 0.02, pl);
    Object.assign($('logo').style, { opacity: pl, letterSpacing: ls + 'em', marginRight: -ls + 'em', filter: `blur(${lerp(6, 0, pl)}px)` });
    // Vague qui se dessine
    $('wave').style.clipPath = `inset(0 ${100 - 100 * easeInOut(clamp((t - 1.6) / 1.4))}% 0 0)`;
    // Mentions
    const pc = 0.88 * clamp((t - 2.6) / 1.2);
    ['top', 'seas', 'tag'].forEach((id) => { $(id).style.opacity = pc; });
    const k = (1 - Math.cos(2 * Math.PI * ((t % 2.4) / 2.4))) / 2;
    Object.assign($('dot').style, { opacity: lerp(1, 0.35, k), transform: `scale(${lerp(1, 0.75, k)})` });
    // Phrase tapée + curseur qui clignote
    const n = instants.filter((x) => x <= t).length;
    $('lede').textContent = TEXTE.slice(0, n);
    const curseur = t >= 2.6 && t < FIN_FRAPPE + 0.9 && (n < TEXTE.length || Math.floor(t * 2) % 2 === 0);
    $('cursor').style.visibility = curseur ? 'visible' : 'hidden';
    // Sous-titre puis adresse du site
    for (const [id, debut] of [['sub', DEBUT_SUB], ['url', DEBUT_URL]]) {
      const p = easeOut(clamp((t - debut) / 1.0));
      Object.assign($(id).style, { opacity: p, transform: `translateY(${lerp(24, 0, p)}px)` });
    }
    // Grain de pellicule qui bouge (12 fois par seconde)
    const g = Math.floor(t * 12);
    $('grain').style.transform = `translate(${(g * 73) % 160}px, ${(g * 131) % 160}px)`;
  };

  // Affiche l'image de l'eau correspondant à l'instant t, dessine tout, puis attend que ce soit peint
  window.__image = async (t) => {
    const n = Math.min(449, Math.round(t * 30));
    const eau = $('eau');
    eau.src = `../.cache/story-eau/${String(n).padStart(5, '0')}.jpg`;
    await eau.decode();
    window.__rendu(t);
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    return true;
  };
  window.__rendu(0);
</script>
</body>
</html>
